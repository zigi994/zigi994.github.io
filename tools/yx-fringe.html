<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>yx fringe</title></head>
<body>
<pre id="log">PENDING</pre>
<script type="module">
  const logEl = document.getElementById('log');
  const log = (s) => { logEl.textContent += '\n' + s; };
  const toBlob = (c) => new Promise((ok) => c.toBlob(ok, 'image/png'));
  async function post(name, blob) {
    const res = await fetch('/_save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    if (!res.ok) throw new Error('save ' + res.status);
  }
  function load(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(src));
      img.src = src;
    });
  }

  function haloCount(d, w, h) {
    let n = 0;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = (y * w + x) * 4;
        if (d[i + 3] < 200) continue;
        let empty = false;
        if (d[i - 4 + 3] < 30 || d[i + 4 + 3] < 30 || d[i - w * 4 + 3] < 30 || d[i + w * 4 + 3] < 30) empty = true;
        if (!empty) continue;
        const min = Math.min(d[i], d[i + 1], d[i + 2]);
        const max = Math.max(d[i], d[i + 1], d[i + 2]);
        if (min > 186 && max - min < 36) n++;
      }
    }
    return n;
  }

  function peelPhoto(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const w = canvas.width, h = canvas.height, n = w * h;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const before = haloCount(d, w, h);
    const pale = new Uint8Array(n);
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      if (d[i + 3] < 40) continue;
      const min = Math.min(d[i], d[i + 1], d[i + 2]);
      const max = Math.max(d[i], d[i + 1], d[i + 2]);
      const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
      if (min > 176 && max - min < 42 && lum > 192) pale[p] = 1;
    }
    const dist = new Int16Array(n);
    dist.fill(99);
    const stack = [];
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const p = y * w + x;
        if (!pale[p]) continue;
        const i = p * 4;
        if (d[i - 4 + 3] < 30 || d[i + 4 + 3] < 30 || d[i - w * 4 + 3] < 30 || d[i + w * 4 + 3] < 30) {
          dist[p] = 0;
          stack.push(p);
        }
      }
    }
    let head = 0;
    while (head < stack.length) {
      const p = stack[head++];
      if (dist[p] >= 5) continue;
      const x = p % w;
      for (const q of [p - 1, p + 1, p - w, p + w]) {
        if (q < 0 || q >= n || !pale[q] || dist[q] <= dist[p] + 1) continue;
        if (Math.abs((q % w) - x) > 1) continue;
        dist[q] = dist[p] + 1;
        stack.push(q);
      }
    }
    let tinted = 0;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const p = y * w + x;
        if (dist[p] > 5) continue;
        let src = -1;
        for (let r = 1; r <= 14 && src < 0; r++) {
          for (const [dx, dy] of [[r, 0], [-r, 0], [0, r], [0, -r]]) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            const q = ny * w + nx;
            if (d[q * 4 + 3] > 200 && !pale[q]) { src = q; break; }
          }
        }
        if (src < 0) continue;
        const i = p * 4, j = src * 4;
        d[i] = d[j]; d[i + 1] = d[j + 1]; d[i + 2] = d[j + 2];
        tinted++;
      }
    }
    for (let pass = 0; pass < 5; pass++) {
      const copy = new Uint8ClampedArray(d);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (copy[i + 3] < 40) continue;
          if (copy[i - 4 + 3] > 30 && copy[i + 4 + 3] > 30 && copy[i - w * 4 + 3] > 30 && copy[i + w * 4 + 3] > 30) continue;
          const min = Math.min(copy[i], copy[i + 1], copy[i + 2]);
          const max = Math.max(copy[i], copy[i + 1], copy[i + 2]);
          if (min > 214 && max - min < 28) d[i + 3] = 0;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    return { before, after: haloCount(d, w, h), nkill: tinted, w, h };
  }

  function peelFlat(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const before = haloCount(d, w, h);
    for (let pass = 0; pass < 3; pass++) {
      const copy = new Uint8ClampedArray(d);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (copy[i + 3] < 40) continue;
          let empty = false;
          if (copy[i - 4 + 3] < 30 || copy[i + 4 + 3] < 30 || copy[i - w * 4 + 3] < 30 || copy[i + w * 4 + 3] < 30) empty = true;
          if (!empty) continue;
          const min = Math.min(copy[i], copy[i + 1], copy[i + 2]);
          const max = Math.max(copy[i], copy[i + 1], copy[i + 2]);
          const lum = (copy[i] + copy[i + 1] + copy[i + 2]) / 3;
          if (max - min > 22 || lum < 140) continue;
          let nearInk = false;
          for (let dy = -2; dy <= 2 && !nearInk; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const q = ((y + dy) * w + (x + dx)) * 4;
              if (q < 0 || q >= copy.length) continue;
              const qlum = (copy[q] + copy[q + 1] + copy[q + 2]) / 3;
              if (copy[q + 3] > 200 && qlum < 55) nearInk = true;
            }
          }
          if (nearInk || min > 214) d[i + 3] = 0;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    return { before, after: haloCount(d, w, h), w, h };
  }

  function chokeFringe(canvas, passes) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const before = haloCount(d, w, h);
    let removed = 0;
    for (let pass = 0; pass < passes; pass++) {
      const copy = new Uint8ClampedArray(d);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (copy[i + 3] < 40) continue;
          let ex = 0, ey = 0, empty = 0;
          const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          for (const [dx, dy] of dirs) {
            if (copy[((y + dy) * w + (x + dx)) * 4 + 3] < 30) { empty++; ex += dx; ey += dy; }
          }
          if (!empty) continue;
          const ix = ex === 0 ? 0 : (ex > 0 ? -1 : 1);
          const iy = ey === 0 ? 0 : (ey > 0 ? -1 : 1);
          let src = -1;
          for (let r = 2; r <= 5; r++) {
            const nx = x + ix * r, ny = y + iy * r;
            if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) break;
            const q = (ny * w + nx) * 4;
            if (copy[q + 3] < 180) break;
            let inner = 0;
            for (const [dx, dy] of dirs) {
              if (copy[((ny + dy) * w + (nx + dx)) * 4 + 3] < 30) inner++;
            }
            if (inner) continue;
            src = q;
            break;
          }
          if (src < 0) continue;
          const min = Math.min(copy[i], copy[i + 1], copy[i + 2]);
          const max = Math.max(copy[i], copy[i + 1], copy[i + 2]);
          const imin = Math.min(copy[src], copy[src + 1], copy[src + 2]);
          const imax = Math.max(copy[src], copy[src + 1], copy[src + 2]);
          const lum = (copy[i] + copy[i + 1] + copy[i + 2]) / 3;
          const ilum = (copy[src] + copy[src + 1] + copy[src + 2]) / 3;
          const whiter = min > imin + 10 && lum > ilum + 8;
          const paler = (max - min) + 6 < (imax - imin) && lum > ilum - 4 && min > 176;
          if (whiter || paler) { d[i + 3] = 0; removed++; }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    return { before, after: haloCount(d, w, h), removed, w, h };
  }

  function defringe(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const before = haloCount(d, w, h);
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let pass = 0; pass < 4; pass++) {
      const copy = new Uint8ClampedArray(d);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (copy[i + 3] < 40) continue;
          let ex = 0, ey = 0, empty = 0;
          for (const [dx, dy] of dirs) {
            const q = ((y + dy) * w + (x + dx)) * 4;
            if (copy[q + 3] < 30) { empty++; ex += dx; ey += dy; }
          }
          if (!empty) continue;
          const ix = ex === 0 ? 0 : (ex > 0 ? -1 : 1);
          const iy = ey === 0 ? 0 : (ey > 0 ? -1 : 1);
          let src = -1;
          for (let r = 2; r <= 6; r++) {
            const nx = x + ix * r, ny = y + iy * r;
            if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) break;
            const q = (ny * w + nx) * 4;
            if (copy[q + 3] < 220) continue;
            let innerEmpty = 0;
            for (const [dx, dy] of dirs) {
              if (copy[((ny + dy) * w + (nx + dx)) * 4 + 3] < 30) innerEmpty++;
            }
            if (innerEmpty) continue;
            src = q;
            break;
          }
          const r = copy[i], g = copy[i + 1], b = copy[i + 2];
          const min = Math.min(r, g, b), max = Math.max(r, g, b);
          const lum = (r + g + b) / 3;
          const sat = max - min;
          let darker = -1;
          for (let rad = 2; rad <= 8 && darker < 0; rad++) {
            const nx = x + ix * rad, ny = y + iy * rad;
            if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) break;
            const q = (ny * w + nx) * 4;
            if (copy[q + 3] < 200) break;
            const qlum = (copy[q] + copy[q + 1] + copy[q + 2]) / 3;
            if (qlum < lum - 28) darker = q;
          }
          if (darker < 0 && src < 0) {
            if (min > 200 && sat < 30) d[i + 3] = 0;
            continue;
          }
          const ref = darker >= 0 ? darker : src;
          const ilum = (copy[ref] + copy[ref + 1] + copy[ref + 2]) / 3;
          if (min > 196 && sat < 34 && lum > ilum + 22) { d[i + 3] = 0; continue; }
          if (lum < ilum + 20 || sat > 48) continue;
          const t = Math.min(0.75, (lum - ilum) / Math.max(24, 255 - ilum));
          if (t < 0.18) continue;
          const k = 1 - t;
          d[i] = Math.max(0, Math.min(255, Math.round((r - 255 * t) / k)));
          d[i + 1] = Math.max(0, Math.min(255, Math.round((g - 255 * t) / k)));
          d[i + 2] = Math.max(0, Math.min(255, Math.round((b - 255 * t) / k)));
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    return { before, after: haloCount(d, w, h), w, h };
  }

  const files = [];
  for (let i = 1; i <= 12; i++) files.push('face-' + String(i).padStart(2, '0') + '.png');

  try {
    log('fringe');
    for (const file of files) {
      const img = await load('/assets/ip/yx/' + file + '?fresh=' + Date.now());
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      const info = chokeFringe(c, 2);
      await post('zigi994/assets/ip/yx/' + file, await toBlob(c));
      log(file + ' ' + info.before + ' -> ' + info.after);
    }
    log('DONE');
  } catch (err) {
    log('ERROR ' + (err.stack || err.message));
  }
</script>
</body>
</html>
