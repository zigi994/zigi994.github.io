<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>rasterize</title></head>
<body>
<div id="out">PENDING</div>
<script type="module">
  import * as pdfjsLib from './pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

  const params = new URLSearchParams(location.search);
  const pageNum = Number(params.get('page') || 1);
  const maxEdge = Number(params.get('max') || 1600);
  const fmt = params.get('fmt') || 'png';
  const quality = Number(params.get('q') || 0.92);

  const out = document.getElementById('out');
  try {
    const doc = await pdfjsLib.getDocument({ url: './source.pdf' }).promise;
    const page = await doc.getPage(pageNum);
    const base = page.getViewport({ scale: 1 });
    const scale = maxEdge / Math.max(base.width, base.height);
    const vp = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    if (fmt === 'jpeg') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    await page.render({ canvasContext: ctx, viewport: vp }).promise;

    const mime = fmt === 'jpeg' ? 'image/jpeg' : (fmt === 'webp' ? 'image/webp' : 'image/png');
    const url = canvas.toDataURL(mime, quality);
    out.textContent = 'OK|' + canvas.width + '|' + canvas.height + '|' + url.slice(url.indexOf(',') + 1);
  } catch (err) {
    out.textContent = 'ERROR: ' + err.message;
  }
</script>
</body>
</html>
