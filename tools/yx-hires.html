<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>yx hires</title></head>
<body>
<pre id="log">PENDING</pre>
<script type="module">
  import * as pdfjsLib from './pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';
  const logEl = document.getElementById('log');
  const lines = [];
  const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); };
  async function post(name, blob) {
    const res = await fetch('/_save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    if (!res.ok) throw new Error('save ' + name);
  }
  const toBlob = (c) => new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
  try {
    const doc = await pdfjsLib.getDocument({ url: './_qa/vi.pdf' }).promise;
    log('pages ' + doc.numPages);
    for (const pageNum of [19, 21]) {
      const page = await doc.getPage(pageNum);
      const base = page.getViewport({ scale: 1 });
      const scale = 2800 / Math.max(base.width, base.height);
      const vp = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(vp.width);
      canvas.height = Math.round(vp.height);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      await post('tools/_qa/hires-p' + pageNum + '.jpg', await toBlob(canvas));
      log('page ' + pageNum + ' ' + canvas.width + 'x' + canvas.height + ' base ' + Math.round(base.width) + 'x' + Math.round(base.height));
    }
    log('DONE');
  } catch (err) {
    log('ERROR: ' + (err.stack || err.message));
  }
</script>
</body>
</html>
