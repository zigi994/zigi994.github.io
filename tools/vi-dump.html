<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>vi dump</title></head>
<body>
<pre id="log">PENDING</pre>
<script type="module">
  import * as pdfjsLib from './pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

  const logEl = document.getElementById('log');
  const lines = [];
  const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); };

  async function post(name, blob) {
    const res = await fetch('/_save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    if (!res.ok) throw new Error('save ' + name + ' ' + res.status);
  }

  try {
    log('open');
    const doc = await pdfjsLib.getDocument({ url: './source.pdf' }).promise;
    log('pages ' + doc.numPages);
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const scale = 1000 / Math.max(base.width, base.height);
      const vp = page.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width);
      c.height = Math.round(vp.height);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.72));
      const name = 'tools/_qa/vi/p-' + String(i).padStart(2, '0') + '.jpg';
      await post(name, blob);
      log('saved ' + i + ' ' + c.width + 'x' + c.height);
    }
    log('DONE');
  } catch (err) {
    log('ERROR: ' + err.message);
  }
</script>
</body>
</html>
