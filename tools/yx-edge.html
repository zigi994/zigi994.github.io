<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>yx edge</title></head>
<body>
<pre id="log">PENDING</pre>
<script type="module">
  const logEl = document.getElementById('log');
  const lines = [];
  const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); };

  async function post(name, blob) {
    const res = await fetch('/_save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    if (!res.ok) throw new Error('save ' + name + ' ' + res.status);
  }
  const toBlob = (c) => new Promise((ok) => c.toBlob(ok, 'image/png'));
  function load(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(src));
      img.src = src;
    });
  }

  function boxes(img, minArea) {
    const w = img.width, h = img.height;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, w, h).data;
    const ink = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      if (data[i] > 248 && data[i + 1] > 248 && data[i + 2] > 248) continue;
      ink[p] = 1;
    }
    const seen = new Uint8Array(w * h);
    const found = [];
    const stack = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const start = y * w + x;
        if (!ink[start] || seen[start]) continue;
        let minX = x, maxX = x, minY = y, maxY = y, area = 0;
        stack.length = 0;
        stack.push(start);
        seen[start] = 1;
        while (stack.length) {
          const p = stack.pop();
          const py = (p / w) | 0;
          const px = p - py * w;
          area++;
          if (px < minX) minX = px;
          if (px > maxX) maxX = px;
          if (py < minY) minY = py;
          if (py > maxY) maxY = py;
          if (px > 0 && ink[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; stack.push(p - 1); }
          if (px < w - 1 && ink[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; stack.push(p + 1); }
          if (py > 0 && ink[p - w] && !seen[p - w]) { seen[p - w] = 1; stack.push(p - w); }
          if (py < h - 1 && ink[p + w] && !seen[p + w]) { seen[p + w] = 1; stack.push(p + w); }
        }
        if (area >= minArea) found.push({ minX, minY, maxX, maxY });
      }
    }
    found.sort((a, b) => (a.minY - b.minY) || (a.minX - b.minX));
    return { canvas: c, found };
  }

  function crop(src, box) {
    const pad = 14;
    const bw = box.maxX - box.minX + 1;
    const bh = box.maxY - box.minY + 1;
    const c = document.createElement('canvas');
    c.width = bw + pad * 2;
    c.height = bh + pad * 2;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(src, box.minX, box.minY, bw, bh, pad, pad, bw, bh);
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] > 242 && d[i + 1] > 242 && d[i + 2] > 242) d[i + 3] = 0;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  function satOf(d, i) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    return Math.max(r, g, b) - Math.min(r, g, b);
  }

  function cleanEdges(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const w = canvas.width, h = canvas.height, n = w * h;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const low = new Uint8Array(n);
    const color = new Uint8Array(n);
    let c0 = w, c1 = 0;
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      if (d[i + 3] < 40) continue;
      if (satOf(d, i) > 34) {
        color[p] = 1;
        const x = p % w;
        if (x < c0) c0 = x;
        if (x > c1) c1 = x;
      } else {
        const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (lum > 60 && lum < 225) low[p] = 1;
      }
    }
    const spanMin = Math.max(36, (c1 - c0) * 0.42);
    // 0 keep, 1 interior horizontal, 2 interior vertical, 3 exterior
    const mark = new Uint8Array(n);
    const walk = (x, y, dx, dy) => {
      for (let r = 1; r <= 5; r++) {
        const nx = x + dx * r, ny = y + dy * r;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) return 'empty';
        const q = ny * w + nx;
        if (d[q * 4 + 3] < 40) return 'empty';
        if (color[q]) return 'color';
      }
      return 'thick';
    };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (!low[p]) continue;
        const up = walk(x, y, 0, -1), dn = walk(x, y, 0, 1);
        const lf = walk(x, y, -1, 0), rt = walk(x, y, 1, 0);
        if (up === 'color' && dn === 'color') mark[p] = 1;
        else if (lf === 'color' && rt === 'color') mark[p] = 2;
        else if ((up === 'empty' && dn === 'empty') || (lf === 'empty' && rt === 'empty')) mark[p] = 3;
      }
    }
    const kill = new Uint8Array(n);
    for (let y = 0; y < h; y++) {
      let x0 = w, x1 = 0, count = 0;
      for (let x = 0; x < w; x++) if (mark[y * w + x] === 1) { count++; if (x < x0) x0 = x; if (x > x1) x1 = x; }
      if (count >= 8 && (x1 - x0) >= spanMin) {
        for (let x = 0; x < w; x++) if (mark[y * w + x] === 1) kill[y * w + x] = 1;
      }
    }
    for (let x = 0; x < w; x++) {
      let y0 = h, y1 = 0, count = 0;
      for (let y = 0; y < h; y++) if (mark[y * w + x] === 2) { count++; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (count >= 8 && (y1 - y0) >= spanMin) {
        for (let y = 0; y < h; y++) if (mark[y * w + x] === 2) kill[y * w + x] = 1;
      }
    }
    for (let p = 0; p < n; p++) if (mark[p] === 3) kill[p] = 1;

    const nearest = (x, y) => {
      for (let r = 1; r <= 6; r++) {
        for (const [nx, ny] of [[x, y - r], [x, y + r], [x - r, y], [x + r, y]]) {
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const q = ny * w + nx;
          if (!kill[q] && color[q] && d[q * 4 + 3] > 200) return q;
        }
      }
      return -1;
    };
    let removed = 0, filled = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (!kill[p]) continue;
        const src = mark[p] === 3 ? -1 : nearest(x, y);
        const i = p * 4;
        if (src >= 0) {
          const j = src * 4;
          d[i] = d[j]; d[i + 1] = d[j + 1]; d[i + 2] = d[j + 2]; d[i + 3] = 255;
          filled++;
        } else {
          d[i + 3] = 0;
          removed++;
        }
      }
    }
    // Pale specks left outside the black outline.
    let fringe = 0;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = (y * w + x) * 4;
        if (d[i + 3] < 40) continue;
        const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (satOf(d, i) > 18 || lum < 70 || lum > 220) continue;
        let empty = 0, dark = 0;
        for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
          const q = (ny * w + nx) * 4;
          if (d[q + 3] < 40) empty++;
          else if (satOf(d, q) < 30 && (d[q] + d[q + 1] + d[q + 2]) / 3 < 60) dark++;
        }
        if (empty > 0 && dark > 0) { d[i + 3] = 0; fringe++; }
      }
    }
    ctx.putImageData(img, 0, 0);
    return { removed, filled, fringe, w, h };
  }

  try {
    log('dye');
    const board = await load('/assets/ip/yx/b-19.webp?fresh=1');
    const { canvas, found } = boxes(board, 3000);
    let n = 0;
    for (const box of found) {
      const bw = box.maxX - box.minX;
      const bh = box.maxY - box.minY;
      if (bh < 80 || bw < 40 || bw > board.width * 0.72) continue;
      n++;
      const cut = crop(canvas, box);
      const info = cleanEdges(cut);
      await post('zigi994/assets/ip/yx/dye-cut-' + n + '.png', await toBlob(cut));
      log('cut ' + n + ' ' + info.w + 'x' + info.h + ' out ' + info.removed + ' fill ' + info.filled);
    }
    log('DONE');
  } catch (err) {
    log('ERROR: ' + (err.stack || err.message));
  }
</script>
</body>
</html>
