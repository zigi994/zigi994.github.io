<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>audit</title>
<style>
  html,body{margin:0;background:#111;color:#ddd;font:12px/1.5 ui-monospace,Consolas,monospace}
  #log{white-space:pre-wrap;padding:12px;margin:0}
  /* The stage parks off-canvas so iframes can be wider than the host window
     without introducing a scrollbar that would skew overflow measurements.
     The pixel probe moves it to the document origin for the duration of a
     capture and puts it straight back -- see holdStageOnScreen(). Only the
     container's own offset changes, so the iframe never relayouts. */
  #stage{position:absolute;left:-20000px;top:0;width:0;height:0;overflow:visible;z-index:9}
  #stage iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<pre id="log">running…</pre>
<div id="stage"></div>
<script>
/* ============================================================
   QA audit harness.

   Layout contract:
     - this page is served from  /__tools/audit.html
     - the site under test is served from  /            (repo: zigi994/)
     - the save sink takes REPO-RELATIVE names:  /_save?name=tools/_qa/x.json

   ------------------------------------------------------------
   HOW TO RUN  (this changed -- read it)
   ------------------------------------------------------------
   Contrast is now measured from real painted pixels, which a page cannot
   capture on its own. So there are two modes, and the tool tells you at the
   top of every run which one it is in.

   1. MEASURED (use this one)
        powershell -NoProfile -ExecutionPolicy Bypass -File tools\audit-drive.ps1
      Launches headless Chrome, installs the pixel-sampling bindings, and points
      it at this page. Everything else is unchanged: the harness still drives
      itself, still writes tools/_qa/audit-*.{json,txt}, still touches
      AUDIT_DONE.txt when it finishes. Flags: -Page work/lionup.html, -Vp mobile.

   2. ESTIMATED (fallback)
        open http://localhost:8787/__tools/audit.html
      Still works, still runs every other check. But with no pixel transport
      the backdrop behind a glyph cannot be observed, so contrast falls back to
      the old ancestor-background walk and EVERY contrast figure is stamped
      "estimated". Do not trust those numbers on this site -- see below.

   ------------------------------------------------------------
   WHY: the bug this replaced
   ------------------------------------------------------------
   The old method resolved a backdrop by walking ancestors for an opaque
   background-color. Every dark object on this site paints itself with a
   background-image gradient over a transparent background-color, so the walk
   fell through to <body> and scored the text against the page ground instead
   of the object it actually sits on. Canvas backdrops are invisible to it for
   the same reason, and so is any sibling underlay or blend mode.

   That produced wrong numbers in BOTH directions, which is why it went
   unnoticed for so long: while <body> was near-black the wrong backdrop
   happened to resemble the right one, so pale-on-dark object text passed for
   the wrong reason. Turn the page light and the same bug reports
   .device__hint at 1.02:1 when it is really 4.91:1.

   The replacement makes the compositor do the work: every glyph on the page is
   made transparent, the frame is captured, and the pixels where the glyphs were
   are read back. Gradients, photographs, <canvas>, blend modes, sibling
   underlays and ancestor opacity then all resolve correctly because they were
   actually painted. Both methods are computed on every run and the summary ends
   with a BACKDROP METHOD DISAGREEMENT section, so the old numbers stay visible
   and auditable rather than being quietly replaced.

   Each band is captured twice, glyphs transparent and glyphs painted. The
   difference says which sampled points actually carry ink, which is how text
   hiding under an opaque plate is told apart from text sitting on one, and how
   points landing in the gap between two letters are discarded.

   ------------------------------------------------------------
   HOW CONTRAST IS REPORTED
   ------------------------------------------------------------
   Sub-AA runs are split into four headings, and only the first one fails a page.
   Rolling them together is what made the old report unreadable.

     PAGE CHROME       navigation, headings, body copy, controls. A real defect.
     INSIDE ARTWORK    interiors of ARTEFACT_SCOPES -- the poster comps, app
                       mockups and device screens. The colour is content, it
                       measures the same on both themes, and it is the designer's
                       own work. Reported, not counted.
     ONLY WHILE FADED  fails at its ancestor's opacity but passes at full
                       strength: a deliberate de-emphasis of content the reader
                       is not looking at, like an inactive .showcase__step.
     STROKE-ONLY       color:transparent with a -webkit-text-stroke doing the
                       drawing. Decorative by construction (.footer__mark).

   Three more headings cover text that is not scored at all, each counted in the
   coverage line so nothing disappears silently: clipped out of view and painted
   nowhere, paints no pixels because something opaque covers it, and no painted
   colour at all. Tap targets keep their existing inline-in-prose advisory.
   ============================================================ */

const SITE = location.origin + '/';
const OUT_DIR = 'tools/_qa/';

const PAGES = [
  'index.html',
  'work/quchong.html',
  'work/yuexing.html',
  'work/lionup.html',
  'work/mountain-stay.html',
  'work/linxi.html',
  'work/chashi.html',
];

const VIEWPORTS = [
  { tag: 'desktop',  w: 1440, h: 1000 },
  { tag: 'laptop',   w: 1024, h: 768 },
  { tag: 'portrait', w: 768,  h: 1024 },
  { tag: 'mobile',   w: 390,  h: 844 },
];

/* The dark theme's --ink-0, used by the LEGACY backdrop walk as its last resort
   when every ancestor background resolves to transparent. Deliberately left as
   a stale constant: it is part of what the old method got wrong (on a light
   page it guesses near-black), and the disagreement report is only honest if it
   reproduces the old behaviour exactly rather than a repaired version of it. */
const LEGACY_CANVAS_FALLBACK = [0x12, 0x11, 0x0d];

/* Scopes whose interior colour is CONTENT rather than page chrome: the
   designer's own poster comps, the app UI mockups, the device screens. These
   are the same boundaries tokens.css re-declares the dark ramp at, because they
   are all objects photographed in a dark room and they stay dark on the light
   theme by design.

   A sub-AA run inside one of these is still measured and still printed, but
   under its own heading and outside the page verdict -- the same treatment the
   tap-target check already gives an inline-in-prose link. The point is that
   "the kicker on your poster artwork is 1.86:1" is a note about artwork, not a
   broken page, and burying it in with real chrome defects is what makes people
   stop reading the report. */
const ARTEFACT_SCOPES = ['.lposter', '.appcard', '.ooh', '.sleeve', '.spost',
  '.nodeui', '.device'];

const REQUIRED_HEAD = {
  styles: ['tokens.css', 'base.css', 'components.css', 'transitions.css'],
  pageStyles: ['home.css', 'case.css', 'concept.css'],
  scripts: ['scripts/sw-register.js', 'scripts/navigation.js'],
  refs: ['favicon.svg', 'manifest.webmanifest'],
};

const params = new URLSearchParams(location.search);
const only = params.get('page');
const onlyVp = params.get('vp');
const pageList = only ? [only] : PAGES;
const vpList = onlyVp ? VIEWPORTS.filter((v) => v.tag === onlyVp) : VIEWPORTS;

const lines = [];
const log = (m) => {
  lines.push(m);
  document.getElementById('log').textContent = lines.join('\n');
};

const round = (n) => Math.round(n * 10) / 10;

/* ---------------- colour maths (WCAG 2.x) ---------------- */

function parseColor(str) {
  if (!str) return null;
  const s = String(str).trim();
  // #rgb / #rrggbb — how the pixel sampler reports a colour, and how tokens are
  // authored. getComputedStyle never returns this form, which is why the first
  // version of the probe silently discarded every sample it took.
  const h = s.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (h) {
    const d = h[1];
    const x = d.length === 3 ? d.split('').map((c) => c + c) : [d.slice(0, 2), d.slice(2, 4), d.slice(4, 6)];
    return { r: parseInt(x[0], 16), g: parseInt(x[1], 16), b: parseInt(x[2], 16), a: 1 };
  }
  const m = s.match(/^rgba?\(([^)]+)\)$/);
  if (!m) return null;
  const p = m[1].split(/[,\s/]+/).filter((t) => t.length).map(Number);
  if (p.length < 3 || p.some((n) => Number.isNaN(n))) return null;
  return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
}

function over(fg, bg) {
  const a = fg.a;
  return [
    fg.r * a + bg[0] * (1 - a),
    fg.g * a + bg[1] * (1 - a),
    fg.b * a + bg[2] * (1 - a),
  ];
}

function relLum(rgb) {
  const f = (v) => {
    const c = v / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}

function contrast(a, b) {
  const l1 = relLum(a);
  const l2 = relLum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}

const hex = (rgb) => '#' + rgb.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');

/* WCAG 2.x large-text threshold: 18pt (24px), or 14pt (18.66px) at >=700.
   The old code only looked at text under 18px and always demanded 4.5, so it
   was blind to two whole bands -- 18-24px normal text, which needs 4.5 and was
   skipped entirely, and anything >=24px, which needs 3 and was also skipped. A
   28px heading at 2:1 was invisible to this tool. */
function needFor(fontSizePx, fontWeight) {
  const bold = parseInt(fontWeight, 10) >= 700;
  const large = fontSizePx >= 24 || (fontSizePx >= 18.66 && bold);
  return large ? 3 : 4.5;
}

/* ---------------- pixel transport ----------------

   audit-drive.ps1 installs two CDP bindings before this page loads:

     window.__auditShot(json)   ask for pixels; the driver captures the given
                                page-coordinate rect and calls back into
                                window.__auditShotResult with one colour per
                                requested point
     window.__auditDone(json)   tell the driver the run is over

   Sampling happens driver-side on purpose. Handing whole PNGs back into the
   page would move hundreds of megabytes across the protocol over a full run;
   sending a point list and getting hex strings back keeps both directions tiny.
   ------------------------------------------------------------ */

const HAS_PIXELS = typeof window.__auditShot === 'function';

let shotSeq = 0;
const shotPending = new Map();

window.__auditShotResult = function (json) {
  let msg;
  try { msg = JSON.parse(json); } catch (e) { return; }
  const p = shotPending.get(msg.id);
  if (!p) return;
  shotPending.delete(msg.id);
  if (msg.error) p.reject(new Error(msg.error));
  else p.resolve(msg.colors.map(parseColor));
};

/* rect is in this document's page coordinates; points are absolute page
   coordinates too. Resolves to one {r,g,b,a} per point, or null for a point the
   driver could not read. */
function samplePixels(rect, points) {
  const id = ++shotSeq;
  const done = new Promise((resolve, reject) => {
    shotPending.set(id, { resolve, reject });
    setTimeout(() => {
      if (shotPending.delete(id)) reject(new Error('pixel sample timed out'));
    }, 30000);
  });
  window.__auditShot(JSON.stringify({
    id,
    rect: { x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.w), h: Math.round(rect.h) },
    points: points.map((p) => [Math.round(p[0]), Math.round(p[1])]),
  }));
  return done;
}

/* The stage lives off-canvas so the iframe can exceed the host window. Content
   that far outside the viewport is not guaranteed to be painted, so it comes
   back to the document origin for the length of one capture. */
async function holdStageOnScreen(fn) {
  const stage = document.getElementById('stage');
  const parked = stage.style.left;
  stage.style.left = '0px';
  window.scrollTo(0, 0);
  // Two frames: one to commit the offset, one to be sure it has been painted.
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  try { return await fn(); } finally { stage.style.left = parked || '-20000px'; }
}

/* Two classes, because each band is captured twice.

   .__auditFreeze stays on for the whole probe phase. A capture is asynchronous,
   so anything still moving between reading a glyph's rect and reading the pixel
   under it would desync the two.

   .__auditProbing is toggled: on, every glyph goes transparent and the frame
   shows nothing but the backdrops; off, the page paints normally. Differencing
   the two captures is what identifies which sampled points actually have ink on
   them -- see sampleBand().

   Only glyph fill goes. The element keeps its background, borders, size and
   position, so the geometry is identical between the two captures.
   -webkit-text-stroke is included because .footer__mark draws itself entirely
   with one, and a surviving stroke would be sampled as though it were backdrop.
   SVG is narrowed to <text>/<tspan>: a blanket `fill: transparent` would erase
   the version-tree nodes and every icon, which ARE legitimate backdrop. */
const PROBE_CSS = `
html.__auditFreeze *,
html.__auditFreeze *::before,
html.__auditFreeze *::after {
  animation-play-state: paused !important;
  transition: none !important;
}
html.__auditProbing *,
html.__auditProbing *::before,
html.__auditProbing *::after {
  -webkit-text-fill-color: transparent !important;
  -webkit-text-stroke-color: transparent !important;
  text-shadow: none !important;
  text-decoration-color: transparent !important;
  caret-color: transparent !important;
}
html.__auditProbing text,
html.__auditProbing tspan { fill: transparent !important; }
`;

/* LEGACY backdrop resolution, kept for one reason: the disagreement report.
   Walk ancestors collecting background layers until an opaque one is hit, then
   composite downward. Returns { rgb, imageAt } where imageAt names the nearest
   ancestor painting a background-image.

   imageAt is the tell. Whenever it is non-null this method is guessing, because
   a gradient or photograph is exactly what it cannot see -- and on this site
   that covers every device mockup, poster and app screen. It also cannot see a
   <canvas>, which is what the homepage hero paints its type over. */
function legacyAncestorBg(el, w) {
  const stack = [];
  let imageAt = null;
  let node = el;
  let base = null;
  while (node && node.nodeType === 1) {
    const cs = w.getComputedStyle(node);
    if (!imageAt && cs.backgroundImage && cs.backgroundImage !== 'none') {
      imageAt = sel(node) + ' { background-image: ' + cs.backgroundImage.slice(0, 48) + '… }';
    }
    const c = parseColor(cs.backgroundColor);
    if (c && c.a > 0.001) {
      if (c.a >= 0.999) { base = [c.r, c.g, c.b]; break; }
      stack.push(c);
    }
    node = node.parentElement;
  }
  if (!base) base = LEGACY_CANVAS_FALLBACK.slice();
  for (let i = stack.length - 1; i >= 0; i--) base = over(stack[i], base);
  return { rgb: base, imageAt };
}

/* Also legacy. A patch on the walk above for backgrounds painted by a *sibling*
   under the text — sliding tab pills, tinted overlays, absolutely positioned
   plates. Without it, `.ftabs__btn.is-active` read as near-black-on-dark when it
   is really dark-on-accent. The pixel probe gets this for free, since a sibling
   underlay is just something that was painted. */
function legacyUnderlayBg(el, rect, opaques) {
  const cx = (rect.left + rect.right) / 2;
  const cy = (rect.top + rect.bottom) / 2;
  let best = null;
  let bestArea = Infinity;
  for (const o of opaques) {
    if (o.el === el || o.el.contains(el) || el.contains(o.el)) continue;
    const r = o.rect;
    if (r.left > cx || r.right < cx || r.top > cy || r.bottom < cy) continue;
    const area = r.width * r.height;
    if (area < bestArea) { best = o; bestArea = area; }
  }
  return best;
}

/* ---------------- selector helper ---------------- */

function sel(el) {
  if (!el || el.nodeType !== 1) return '?';
  if (el.tagName === 'HTML') return 'html';
  if (el.tagName === 'BODY') return 'body';
  let s = el.tagName.toLowerCase();
  if (el.id) return s + '#' + el.id;
  const cls = (el.getAttribute('class') || '').trim().split(/\s+/).filter(Boolean).slice(0, 3);
  if (cls.length) s += '.' + cls.join('.');
  const p = el.parentElement;
  if (p) {
    const sibs = [...p.children].filter((c) => c.tagName === el.tagName);
    if (sibs.length > 1) s += ':nth-of-type(' + (sibs.indexOf(el) + 1) + ')';
  }
  return s;
}

function path(el) {
  const parts = [];
  let n = el;
  for (let i = 0; n && n.nodeType === 1 && i < 4; i++) {
    parts.unshift(sel(n));
    if (n.tagName === 'BODY') break;
    n = n.parentElement;
  }
  return parts.join(' > ');
}

/* ---------------- geometry helpers ---------------- */

const CLIPS = new Set(['hidden', 'clip', 'auto', 'scroll']);

function visible(el, cs, r) {
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  if (parseFloat(cs.opacity) < 0.05) return false;
  if (r.width < 0.5 || r.height < 0.5) return false;
  return true;
}

/* An element hanging past the viewport edge is only a defect if nothing above it
   clips horizontally — carousels, marquees and tickers legitimately extend past
   their own scroll container. */
function clippedAncestor(el, w) {
  let n = el.parentElement;
  while (n && n.nodeType === 1 && n.tagName !== 'HTML') {
    const cs = w.getComputedStyle(n);
    if (CLIPS.has(cs.overflowX) || CLIPS.has(cs.overflowY)) return n;
    n = n.parentElement;
  }
  return null;
}

function visibleRect(el, w) {
  let r = el.getBoundingClientRect();
  let box = { l: r.left, t: r.top, rr: r.right, b: r.bottom };
  let n = el.parentElement;
  while (n && n.nodeType === 1 && n.tagName !== 'HTML') {
    const cs = w.getComputedStyle(n);
    if (CLIPS.has(cs.overflowX) || CLIPS.has(cs.overflowY)) {
      const p = n.getBoundingClientRect();
      box.l = Math.max(box.l, p.left);
      box.t = Math.max(box.t, p.top);
      box.rr = Math.min(box.rr, p.right);
      box.b = Math.min(box.b, p.bottom);
    }
    n = n.parentElement;
  }
  return box;
}

function directText(el) {
  let t = '';
  for (const n of el.childNodes) if (n.nodeType === 3) t += n.nodeValue;
  return t.replace(/\s+/g, ' ').trim();
}

/* ---------------- the analysis, run against an iframe realm ---------------- */

/* frameOrigin is the iframe's offset inside the HOST document, so a rect in the
   iframe's viewport can be turned into a page coordinate the driver can capture.
   The stage is pinned to the host document origin during a capture, so this is
   (0,0) in practice -- it is passed rather than assumed so moving the stage does
   not silently shift every sample point. */
async function analyze(w, d, vp, pageUrl, frameOrigin) {
  const R = {
    page: pageUrl, vp: vp.tag, vw: vp.w, vh: vp.h,
    method: HAS_PIXELS ? 'measured' : 'estimated',
    doc: {}, overflow: [], clipped: [], overlap: [], images: [],
    tap: [], contrast: [], disagree: [],
    textUnpainted: [], textClipped: [], textOccluded: [],
    head: {}, resources: [], notes: [],
  };

  const de = d.documentElement;
  R.doc = {
    scrollWidth: de.scrollWidth,
    clientWidth: de.clientWidth,
    innerWidth: w.innerWidth,
    scrollHeight: de.scrollHeight,
    bodyScrollWidth: d.body ? d.body.scrollWidth : 0,
    overflowX: Math.max(0, de.scrollWidth - de.clientWidth),
  };

  const all = [...d.querySelectorAll('*')];
  const VW = de.clientWidth;
  const cache = new Map();
  const csOf = (el) => {
    let c = cache.get(el);
    if (!c) { c = w.getComputedStyle(el); cache.set(el, c); }
    return c;
  };

  /* ---- 1. horizontal overflow ---- */
  for (const el of all) {
    if (el.tagName === 'HTML' || el.tagName === 'BODY') continue;
    const cs = csOf(el);
    const r = el.getBoundingClientRect();
    if (!visible(el, cs, r)) continue;
    if (cs.position === 'fixed') continue;
    const outR = r.right - VW;
    const outL = -r.left;
    if (outR <= 1 && outL <= 1) continue;
    const clipper = clippedAncestor(el, w);
    if (clipper) continue;
    R.overflow.push({
      sel: path(el), tag: el.tagName.toLowerCase(),
      left: round(r.left), right: round(r.right), width: round(r.width),
      pastRight: round(Math.max(0, outR)), pastLeft: round(Math.max(0, outL)),
      pos: cs.position, text: directText(el).slice(0, 60),
    });
  }
  // Keep the widest offenders; a single broken container reports its whole subtree.
  R.overflow.sort((a, b) => (b.pastRight + b.pastLeft) - (a.pastRight + a.pastLeft));
  R.overflow = R.overflow.slice(0, 14);

  /* ---- 2. clipped text + intra-container text overflow ---- */
  const textEls = [];
  const rng = d.createRange();
  for (const el of all) {
    // Screen-reader-only copy is intentionally clipped to a 1px box. Reporting
    // that pattern as lost visible text makes every accessible description a
    // layout failure and incentivises removing the very text assistive tech
    // needs. Only the explicit utility class is exempt; ordinary clipped text
    // still fails below.
    if (el.closest('.sr-only')) continue;
    const txt = directText(el);
    if (!txt) continue;
    const cs = csOf(el);
    const r = el.getBoundingClientRect();
    if (!visible(el, cs, r)) continue;

    // Tight rects over the element's own text nodes, kept PER LINE. A union rect
    // is wrong for inline elements: a <strong> that wraps across two lines has a
    // union box spanning the whole paragraph, which then "overlaps" every
    // sibling on those lines.
    let rect = null;
    const lineRects = [];
    for (const n of el.childNodes) {
      if (n.nodeType !== 3 || !n.nodeValue.trim()) continue;
      rng.selectNodeContents(n);
      for (const rr of rng.getClientRects()) {
        if (rr.width < 1 || rr.height < 1) continue;
        lineRects.push({ left: rr.left, top: rr.top, right: rr.right, bottom: rr.bottom });
        rect = rect ? {
          left: Math.min(rect.left, rr.left), top: Math.min(rect.top, rr.top),
          right: Math.max(rect.right, rr.right), bottom: Math.max(rect.bottom, rr.bottom),
        } : { left: rr.left, top: rr.top, right: rr.right, bottom: rr.bottom };
      }
    }
    textEls.push({ el, cs, r, txt, rect, lineRects });

    // SVG children have no CSS box model; scrollWidth on them is meaningless,
    // but the outer <svg> does clip to its viewport, so measure against that.
    const isSvgChild = el.namespaceURI === 'http://www.w3.org/2000/svg' && el.tagName !== 'svg';
    if (isSvgChild) {
      const owner = el.ownerSVGElement;
      if (owner && el.getBBox) {
        const or = owner.getBoundingClientRect();
        const past = Math.max(0, r.right - or.right) + Math.max(0, or.left - r.left) +
          Math.max(0, r.bottom - or.bottom) + Math.max(0, or.top - r.top);
        if (past > 1) {
          R.clipped.push({
            sel: path(el), kind: 'svg-text-outside-viewport',
            overflowX: 'svg-clip', overflowY: 'svg-clip',
            lostX: round(past), lostY: 0,
            clientW: round(r.width), clientH: round(r.height),
            scrollW: round(or.width), scrollH: round(or.height),
            fontSize: cs.fontSize, text: txt.slice(0, 70),
          });
        }
      }
      continue;
    }

    const hidesX = cs.overflowX === 'hidden' || cs.overflowX === 'clip';
    const hidesY = cs.overflowY === 'hidden' || cs.overflowY === 'clip';
    const intentional = cs.textOverflow === 'ellipsis' ||
      (cs.webkitLineClamp && cs.webkitLineClamp !== 'none');
    const dx = el.scrollWidth - el.clientWidth;
    const dy = el.scrollHeight - el.clientHeight;
    if ((hidesX && dx > 1) || (hidesY && dy > 1)) {
      R.clipped.push({
        sel: path(el), kind: intentional ? 'truncated-by-design' : 'clipped',
        overflowX: cs.overflowX, overflowY: cs.overflowY,
        lostX: dx > 1 ? dx : 0, lostY: dy > 1 ? dy : 0,
        clientW: el.clientWidth, clientH: el.clientHeight,
        scrollW: el.scrollWidth, scrollH: el.scrollHeight,
        fontSize: cs.fontSize, text: txt.slice(0, 70),
      });
    } else if (!hidesX && dx > 2 && cs.overflowX === 'visible') {
      // Content wider than the padding box without a clip: an unbreakable run.
      // scrollWidth also grows for absolutely-positioned descendants and
      // pseudo-elements — a 44px touch-target overlay on a 28px link, say —
      // which overflow nothing visually. getBoundingClientRect covers only the
      // element's own boxes, so comparing the text rect against it isolates the
      // case where the TEXT is what sticks out.
      const past = rect
        ? Math.round(rect.right - (r.right - (parseFloat(cs.borderRightWidth) || 0)))
        : 0;
      if (past > 2) {
        R.clipped.push({
          sel: path(el), kind: 'content-wider-than-box',
          lostX: past, lostY: 0, clientW: el.clientWidth, clientH: el.clientHeight,
          scrollW: el.scrollWidth, scrollH: el.scrollHeight,
          fontSize: cs.fontSize, text: txt.slice(0, 70),
        });
      }
    }
  }
  R.clipped.sort((a, b) => (b.lostX + b.lostY) - (a.lostX + a.lostY));
  R.clipped = R.clipped.slice(0, 18);

  /* ---- 3. text-on-text overlap ---- */
  // Tight rects from the text nodes themselves, intersected with any clipping
  // ancestor, so an off-screen slide's text does not read as an overlap.
  const boxes = [];
  for (const t of textEls.slice(0, 900)) {
    // Range rects span the whole line box, so lines of differing line-height
    // always touch. Strip the half-leading down to the glyph band, else every
    // stat number/label pair reads as a collision.
    const fs = parseFloat(t.cs.fontSize) || 16;
    const lh = parseFloat(t.cs.lineHeight) || fs * 1.2;
    const lead = Math.max(0, (lh - fs * 1.16) / 2);
    const clip = visibleRect(t.el, w);
    const opaque = (parseColor(t.cs.backgroundColor) || { a: 0 }).a > 0.85;
    for (const lr of t.lineRects) {
      const box = {
        l: Math.max(lr.left, clip.l), t: Math.max(lr.top + lead, clip.t),
        r: Math.min(lr.right, clip.rr), b: Math.min(lr.bottom - lead, clip.b),
      };
      if (box.r - box.l < 2 || box.b - box.t < 2) continue;
      boxes.push({ el: t.el, cs: t.cs, txt: t.txt, box, opaque });
    }
  }
  boxes.sort((a, b) => a.box.t - b.box.t);

  const pairSeen = new Map();
  for (let i = 0; i < boxes.length; i++) {
    const A = boxes[i];
    for (let j = i + 1; j < boxes.length; j++) {
      const B = boxes[j];
      if (B.box.t >= A.box.b) break; // sorted by top: nothing below can overlap
      if (A.el === B.el || A.el.contains(B.el) || B.el.contains(A.el)) continue;
      if (A.opaque || B.opaque) continue; // own opaque backdrop == deliberate layering
      const ox = Math.min(A.box.r, B.box.r) - Math.max(A.box.l, B.box.l);
      const oy = Math.min(A.box.b, B.box.b) - Math.max(A.box.t, B.box.t);
      if (ox <= 1 || oy <= 1) continue;
      const area = ox * oy;
      const smaller = Math.min((A.box.r - A.box.l) * (A.box.b - A.box.t),
                               (B.box.r - B.box.l) * (B.box.b - B.box.t));
      const frac = area / smaller;
      if (frac < 0.25) continue;
      const key = path(A.el) + '||' + path(B.el);
      const rec = {
        a: path(A.el), b: path(B.el),
        aText: A.txt.slice(0, 40), bText: B.txt.slice(0, 40),
        overlapPx: round(area), frac: round(frac * 100),
        ox: round(ox), oy: round(oy),
        aPos: A.cs.position, bPos: B.cs.position,
      };
      const prev = pairSeen.get(key);
      if (!prev || prev.overlapPx < area) pairSeen.set(key, rec);
    }
  }
  R.overlap = [...pairSeen.values()].sort((a, b) => b.overlapPx - a.overlapPx).slice(0, 12);

  /* ---- 4. images ---- */
  const allImgs = [...d.querySelectorAll('img')];
  R.imgTotal = allImgs.length;
  R.imgLoaded = allImgs.filter((i) => i.complete && i.naturalWidth > 0).length;
  R.textElTotal = textEls.length;
  R.elTotal = all.length;
  for (const img of allImgs) {
    const cs = csOf(img);
    const r = img.getBoundingClientRect();
    const hasAttr = !!(img.getAttribute('width') && img.getAttribute('height'));
    const cssAspect = cs.aspectRatio && cs.aspectRatio !== 'auto';
    const parent = img.parentElement;
    const pcs = parent ? csOf(parent) : null;
    const parentAspect = pcs && pcs.aspectRatio && pcs.aspectRatio !== 'auto';
    const absFill = cs.position === 'absolute' && cs.top !== 'auto' && cs.bottom !== 'auto';
    const src = img.getAttribute('src') || img.currentSrc || '(no src)';
    const rec = {
      sel: path(img), src, alt: img.getAttribute('alt'),
      loading: img.getAttribute('loading'),
      complete: img.complete, naturalWidth: img.naturalWidth,
      renderW: round(r.width), renderH: round(r.height),
      hasAttrDims: hasAttr, cssAspectRatio: cs.aspectRatio,
      parentAspectRatio: pcs ? pcs.aspectRatio : null,
      objectFit: cs.objectFit, hidden: !visible(img, cs, r),
      issues: [],
    };
    if (img.complete && img.naturalWidth === 0) rec.issues.push('failed-to-load');
    if (!img.complete) rec.issues.push('still-loading-at-measure');
    if (!hasAttr && !cssAspect && !parentAspect && !absFill) rec.issues.push('no-reserved-aspect-ratio');
    if (img.getAttribute('alt') === null) rec.issues.push('missing-alt-attr');
    if (rec.issues.length) R.images.push(rec);
  }

  /* ---- 5. tap targets (all viewports; only reported for mobile) ---- */
  // getBoundingClientRect is not the hit area. Negative margins, and an
  // absolutely positioned pseudo-element used as a touch-target expander, both
  // enlarge what a finger can land on without changing the box. So anything the
  // box test rejects gets a second opinion from elementFromPoint, which is what
  // the browser itself will do on a tap. Reveals are already forced on and the
  // page has been scroll-swept by this point, so moving the scroll here is safe
  // as long as it ends back at the top.
  const inFixed = (el) => {
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      if (csOf(n).position === 'fixed') return true;
    }
    return false;
  };
  const VH = de.clientHeight;
  const probeable = (x, y) => x >= 1 && y >= 1 && x <= VW - 2 && y <= VH - 2;
  const reach = (el, cx, cy, dx, dy) => {
    let far = 0;
    // 1px steps: the centre is rounded to an integer, so a coarser step loses up
    // to 2px per side and reports a compliant 44px target as 43.
    for (let i = 1; i <= 23; i += 1) {
      const px = cx + dx * i, py = cy + dy * i;
      if (!probeable(px, py)) break;
      const hit = d.elementFromPoint(px, py);
      if (!hit || !(hit === el || el.contains(hit))) break;
      far = i;
    }
    return far;
  };
  const hitBox = (el) => {
    // A fixed header hides itself on scroll-down, so those stay at the top.
    if (inFixed(el)) w.scrollTo(0, 0);
    else el.scrollIntoView({ block: 'center' });
    const rr = el.getBoundingClientRect();
    const cx = Math.round(rr.left + rr.width / 2);
    const cy = Math.round(rr.top + rr.height / 2);
    if (!probeable(cx, cy)) return null;
    const hit = d.elementFromPoint(cx, cy);
    if (!hit || !(hit === el || el.contains(hit))) return { covered: true, w: 0, h: 0 };
    return {
      covered: false,
      w: 1 + reach(el, cx, cy, -1, 0) + reach(el, cx, cy, 1, 0),
      h: 1 + reach(el, cx, cy, 0, -1) + reach(el, cx, cy, 0, 1),
    };
  };

  const TAPPABLE = 'a[href],button,input,select,textarea,summary,[role="button"],[role="link"],[role="tab"],[onclick],[tabindex]:not([tabindex="-1"])';
  for (const el of [...d.querySelectorAll(TAPPABLE)]) {
    const cs = csOf(el);
    const r = el.getBoundingClientRect();
    if (!visible(el, cs, r)) continue;
    if (el.tagName === 'INPUT' && ['hidden'].includes(el.type)) continue;
    const w0 = r.width, h0 = r.height;
    if (w0 >= 43.5 && h0 >= 43.5) continue;
    const hb = hitBox(el);
    const hitW = hb && !hb.covered ? Math.max(w0, hb.w) : w0;
    const hitH = hb && !hb.covered ? Math.max(h0, hb.h) : h0;
    if (!(hb && hb.covered) && hitW >= 43.5 && hitH >= 43.5) continue;
    // Links inside running prose are exempt by convention; classify, don't drop.
    let inProse = false;
    let n = el.parentElement;
    while (n && n.nodeType === 1) {
      if (['P', 'LI', 'DD', 'BLOCKQUOTE', 'FIGCAPTION', 'SMALL', 'TD'].includes(n.tagName)) { inProse = true; break; }
      if (n.tagName === 'BODY') break;
      n = n.parentElement;
    }
    R.tap.push({
      sel: path(el), tag: el.tagName.toLowerCase(),
      w: round(w0), h: round(h0),
      hitW: round(hitW), hitH: round(hitH),
      covered: !!(hb && hb.covered), unprobed: !hb,
      label: (el.getAttribute('aria-label') || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 42),
      href: el.getAttribute('href'),
      inProse, display: cs.display, fontSize: cs.fontSize,
    });
  }
  R.tap.sort((a, b) => (a.hitW * a.hitH) - (b.hitW * b.hitH));
  w.scrollTo(0, 0);

  /* ---- 6. contrast ---- */

  // Name the offending colour after the token it came from; "--fg-3 fails" is
  // a fix, "#4b4842 fails" is a scavenger hunt.
  const rootCs = w.getComputedStyle(de);
  const TOKEN_NAMES = ['--fg-0', '--fg-1', '--fg-2', '--fg-3', '--ink-0', '--ink-1',
    '--ink-2', '--ink-3', '--ink-4', '--line', '--line-strong', '--accent',
    '--accent-text', '--accent-ink'];

  /* Custom properties compute to their specified value with var() already
     substituted, but NOT evaluated -- a color-mix() comes back as
     "color-mix(in oklab, #ee5c36 50%, #2a1c0e)". A throwaway span turns any of
     those spellings into resolved rgb(). */
  const resolveColor = (raw) => {
    if (!raw) return null;
    const direct = parseColor(raw);
    if (direct) return direct;
    const probe = d.createElement('span');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;color:' + raw;
    d.body.appendChild(probe);
    const c = parseColor(w.getComputedStyle(probe).color);
    probe.remove();
    return c;
  };

  const tokens = [];
  for (const name of TOKEN_NAMES) {
    const c = resolveColor(rootCs.getPropertyValue(name).trim());
    if (c) tokens.push({ name, raw: rootCs.getPropertyValue(name).trim(), c });
  }
  const tokenFor = (str) => {
    const c = parseColor(str);
    if (!c) return null;
    const hit = tokens.find((t) => t.c.r === c.r && t.c.g === c.g && t.c.b === c.b &&
      Math.abs(t.c.a - c.a) < 0.01);
    return hit ? hit.name : null;
  };

  /* --- accent tiers ---------------------------------------------------------

     The old version of this check read --accent and the seven --a-* project
     tokens off :root and scored each against --ink-0. That was right for the
     dark theme and became correct-but-useless on the light one, where it
     reported 1.76:1 to 3.03:1 on every case page and meant nothing, because
     --accent is a MATERIAL colour -- a lacquer, a glaze, a tea leaf -- and on a
     light ground nothing paints text with it. --accent-text does.

     So the check now asks the only question worth asking: in each accent scope
     the document actually declares, what colour paints glyphs, and does it
     clear 4.5:1 against the ground of that same scope?

     Reading both tokens from the scope rather than from :root is what makes it
     work everywhere. A per-project accent is authored as data-accent on <body>,
     .next and .footer, and tokens.css maps --accent-text off that same
     attribute, so the scope holds the right pair. It also handles the dark
     islands for free: inside .nodeui or .device, tokens.css puts the dark ramp
     back and sets --accent-text to var(--accent), so the scope reports the
     material colour against near-black -- which is exactly what is painted
     there, and it passes.

     Scoring against the scope's own --ink-0 rather than a global one matters for
     the same reason: the ground under an accent glyph inside a dark object is
     not the page ground.
     ------------------------------------------------------------------------ */
  const accentScopes = new Set([de]);
  if (d.body) accentScopes.add(d.body);
  d.querySelectorAll('[data-accent]').forEach((el) => accentScopes.add(el));

  R.accentCheck = [];
  const accentSeen = new Set();
  for (const scope of accentScopes) {
    const scs = w.getComputedStyle(scope);
    const rawText = scs.getPropertyValue('--accent-text').trim();
    const rawMat = scs.getPropertyValue('--accent').trim();
    const rawInk = scs.getPropertyValue('--ink-0').trim();
    // No --accent-text anywhere means a stylesheet predating the text tier; the
    // material colour is then also the text colour and gets checked as such.
    const paints = rawText || rawMat;
    const paintC = resolveColor(paints);
    const inkC = resolveColor(rawInk);
    if (!paintC || !inkC) continue;
    const ground = [inkC.r, inkC.g, inkC.b];
    const glyph = paintC.a < 0.999 ? over(paintC, ground) : [paintC.r, paintC.g, paintC.b];
    const ratio = contrast(glyph, ground);
    const key = hex(glyph) + '|' + hex(ground);
    if (accentSeen.has(key)) continue;
    accentSeen.add(key);
    R.accentCheck.push({
      scope: sel(scope),
      dataAccent: scope.getAttribute && scope.getAttribute('data-accent'),
      textTier: rawText || '(none declared)',
      materialTier: rawMat,
      tierChecked: rawText ? '--accent-text' : '--accent',
      glyph: hex(glyph), ground: hex(ground),
      ratio: Math.round(ratio * 100) / 100,
      needs: 4.5,
      passes45: ratio >= 4.5,
      // Informational: what the material tier would score if it were used as
      // text here. On the light theme this is the number the old check printed.
      materialAsText: (() => {
        const m = resolveColor(rawMat);
        if (!m) return null;
        return Math.round(contrast([m.r, m.g, m.b], ground) * 100) / 100;
      })(),
    });
  }

  const opaques = [];
  for (const el of all) {
    const cs = csOf(el);
    const c = parseColor(cs.backgroundColor);
    if (!c || c.a < 0.85) continue;
    if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.5) continue;
    const rect = el.getBoundingClientRect();
    if (rect.width < 1 || rect.height < 1) continue;
    opaques.push({ el, rect, rgb: [c.r, c.g, c.b], sel: sel(el) });
  }

  /* --- inventory every painted text run -------------------------------------
     Every run, not just the ones under 18px, because the large-text rule needs
     checking too and used to be skipped entirely. */
  let runs = [];
  for (const t of textEls) {
    const cs = t.cs;
    const fs = parseFloat(cs.fontSize) || 16;
    const fg = parseColor(cs.color);
    if (!fg || !t.rect) continue;

    /* Effective opacity of the whole ancestor chain. No contrast tool reads
       this, and a block faded to 0.34 is what the eye actually gets -- the
       sticky showcase steps on quchong are 1.65:1 in their resting state and
       4.97:1 in the one the reader is looking at. Both facts are worth having,
       so the chain is carried through and reported instead of being flattened.

       chainTinted records whether any faded ancestor paints a background of its
       own. Group opacity fades an element's background together with its text
       before compositing the pair onto what is behind, so compositing the glyph
       onto the measured backdrop is exact only when there is no such background
       -- which is the case here, but the flag keeps the report honest if that
       ever stops being true. */
    let eff = 1;
    let chainTinted = false;
    for (let n = t.el; n && n.nodeType === 1; n = n.parentElement) {
      const ncs = (n === t.el) ? cs : csOf(n);
      const o = parseFloat(ncs.opacity);
      if (!(o < 0.999)) continue;
      eff *= o;
      if (n === t.el) continue;
      const bc = parseColor(ncs.backgroundColor);
      if ((bc && bc.a > 0.001) || (ncs.backgroundImage && ncs.backgroundImage !== 'none')) {
        chainTinted = true;
      }
    }
    if (eff < 0.02) continue;

    /* color:transparent is not a 1:1 failure, it is a different treatment.
       .footer__mark draws its whole glyph with -webkit-text-stroke and sets
       color:transparent on purpose; scoring the fill would report the oversized
       wordmark as invisible text. So the stroke becomes the measured colour, and
       a transparent fill with no stroke is recorded as unpainted rather than
       silently dropped or scored as a defect. */
    const strokeW = parseFloat(cs.webkitTextStrokeWidth) || 0;
    const strokeC = parseColor(cs.webkitTextStrokeColor);
    let paint = fg;
    let paintFrom = 'color';
    if (fg.a < 0.02) {
      if (strokeW > 0 && strokeC && strokeC.a > 0.02) {
        paint = strokeC;
        paintFrom = 'text-stroke ' + strokeW + 'px';
      } else {
        R.textUnpainted.push({ sel: path(t.el), text: t.txt.slice(0, 46), color: cs.color });
        continue;
      }
    }

    let artefact = null;
    for (const scope of ARTEFACT_SCOPES) {
      if (t.el.closest && t.el.closest(scope)) { artefact = scope; break; }
    }

    runs.push({
      el: t.el, cs, txt: t.txt, fs, fw: cs.fontWeight,
      paint, paintFrom, eff, chainTinted, artefact,
      needs: needFor(fs, cs.fontWeight),
      measured: null,
    });
  }
  R.textRunTotal = runs.length;

  /* --- the pixel probe ------------------------------------------------------
     Make every glyph transparent, walk the page in viewport-sized bands, and
     read back the pixels where the glyphs were. Five points across each run,
     keeping the WORST, so a run crossing a gradient is scored at its weakest
     point rather than its average. */
  const rng2 = d.createRange();
  const firstRect = (el) => {
    for (const n of el.childNodes) {
      if (n.nodeType !== 3 || !n.nodeValue.trim()) continue;
      rng2.selectNodeContents(n);
      for (const rr of rng2.getClientRects()) {
        if (rr.width >= 2 && rr.height >= 2) return rr;
      }
    }
    return null;
  };

  if (HAS_PIXELS && runs.length) {
    const style = d.createElement('style');
    style.id = '__auditProbeStyle';
    style.textContent = PROBE_CSS;
    d.head.appendChild(style);
    de.classList.add('__auditFreeze');
    de.classList.add('__auditProbing');

    const VWb = de.clientWidth;
    const VHb = de.clientHeight;

    /* A glyph rect is geometry, not visibility. An .odo__digit reel stacks ten
       <i> digits inside a 1em overflow:hidden window and translates one into
       place: the other nine have perfectly real rects that are painted nowhere.
       Sampling one of those reads whatever unrelated element happens to occupy
       that coordinate, which is how the first version of this probe scored the
       homepage counter at 2.19:1 against a celadon fill from a different part of
       the section entirely.

       So a rect is only sampled where it survives intersection with every
       clipping ancestor, and only the surviving part of it is sampled. */
    const clippedRect = (el, r) => {
      const c = visibleRect(el, w);
      const box = {
        left: Math.max(r.left, c.l), top: Math.max(r.top, c.t),
        right: Math.min(r.right, c.rr), bottom: Math.min(r.bottom, c.b),
      };
      box.width = box.right - box.left;
      box.height = box.bottom - box.top;
      if (box.width < 2 || box.height < 2) return null;
      // Mostly-clipped text is a scrolled-away carousel slide, not something a
      // reader is looking at; measuring a 3px sliver of it is not informative.
      const area = box.width * box.height;
      const full = Math.max(1, (r.right - r.left) * (r.bottom - r.top));
      if (area / full < 0.5) return null;
      return box;
    };

    // Rects are re-read inside each band rather than cached from scroll 0, so
    // scroll-driven layout (the sticky showcase, any parallax) cannot desync
    // the sample point from the glyph.
    const sampleBand = async () => {
      const pts = [];
      const owners = [];
      for (const run of runs) {
        if (run.measured) continue;
        const raw = firstRect(run.el);
        if (!raw) continue;
        const r = clippedRect(run.el, raw);
        if (!r) continue;
        run.everVisible = true;
        if (r.top < 2 || r.bottom > VHb - 2) continue;
        /* Trim the half-leading off the line box to get the band the glyphs
           actually occupy, then grid the band. Coverage matters here because a
           point that lands between two letters is indistinguishable from a point
           under an opaque cover, and both captures agree at both. One row of five
           was not enough -- it read a 56px heading and a paragraph of body copy
           as painting nothing. Points are nearly free (they all come out of the
           one capture), so this errs heavily towards enough of them. */
        const lead = Math.max(0, (r.height - run.fs * 1.16) / 2);
        const bandTop = r.top + lead;
        const bandH = Math.max(2, (r.bottom - lead) - bandTop);
        for (let ix = 0; ix < 13; ix++) {
          const cx = r.left + r.width * (0.04 + 0.92 * (ix / 12));
          if (cx < 1 || cx > VWb - 2) continue;
          for (const fy of [0.3, 0.5, 0.7]) {
            const cy = bandTop + bandH * fy;
            if (cy < 1 || cy > VHb - 2) continue;
            pts.push([frameOrigin.x + cx, frameOrigin.y + cy]);
            owners.push({ run, cx, cy });
          }
        }
      }
      if (!pts.length) return 0;
      const rect = { x: frameOrigin.x, y: frameOrigin.y, w: VWb, h: VHb };

      /* Same points, twice: glyphs transparent, then glyphs painted.

         The difference answers a question a single capture cannot. A pixel shows
         what is on top of the stack, not whether the text is part of that stack:
         .pull__hint's label sits under .pull__sheet, an opaque plate that hides
         it until the sheet is dragged, and sampling there reads the sheet's
         celadon skeleton bar and calls it a 2.55:1 defect. Hit-testing looks
         like the fix and is not -- it says the chashi dial readout is covered by
         its own <svg> ring, whose box spans the readout while painting nothing
         there, and the same for a custom slider's transparent <input> overlay.

         Differencing settles it from ground truth. Where the two captures agree,
         no ink landed: either something opaque is over the glyph, or the glyph is
         in the gap between two letters. Where they differ, that point has ink on
         it and the transparent-pass colour is its true backdrop. So contrast ends
         up measured only at points that actually carry ink. */
      const bgColors = await holdStageOnScreen(() => samplePixels(rect, pts));
      de.classList.remove('__auditProbing');
      const fgColors = await holdStageOnScreen(() => samplePixels(rect, pts));
      de.classList.add('__auditProbing');

      // Confirm each sampled point is still inside its glyph before believing
      // the pixels. Catches script-driven motion during the captures, which CSS
      // pausing cannot reach.
      const stillThere = new Map();
      for (const o of owners) {
        if (stillThere.has(o.run)) continue;
        const raw = firstRect(o.run.el);
        stillThere.set(o.run, raw ? clippedRect(o.run.el, raw) : null);
      }

      const INK = 3;   // per-channel difference that counts as ink, out of 255
      let n = 0;
      for (let i = 0; i < owners.length; i++) {
        const bgc = bgColors[i];
        const fgc = fgColors[i];
        if (!bgc || !fgc) continue;
        const { run, cx, cy } = owners[i];
        const now = stillThere.get(run);
        if (!now || cx < now.left - 1 || cx > now.right + 1 || cy < now.top - 1 || cy > now.bottom + 1) {
          run.moved = true;
          continue;
        }
        const bg = [bgc.r, bgc.g, bgc.b];
        const alpha = run.paint.a * run.eff;
        const glyph = alpha < 0.999 ? over({ ...run.paint, a: alpha }, bg) : [run.paint.r, run.paint.g, run.paint.b];

        const painted = Math.max(Math.abs(bgc.r - fgc.r), Math.abs(bgc.g - fgc.g), Math.abs(bgc.b - fgc.b)) >= INK;
        // A stroke-only glyph is a 1px outline round a 273px letterform: almost
        // every point inside it is hollow, so the ink test cannot see it. Its
        // backdrop is still measured correctly, which is what is being scored.
        if (!painted && run.paintFrom === 'color') {
          /* No ink here. Usually a gap between letters or an opaque cover -- but
             if the glyph colour is itself indistinguishable from its backdrop,
             identical captures are exactly what a genuine 1:1 failure looks like,
             and dropping it would turn the worst possible defect into silence. So
             only treat this as "not painted" when there would have been something
             visible to see. */
          const wouldShow = Math.max(Math.abs(glyph[0] - bg[0]), Math.abs(glyph[1] - bg[1]),
            Math.abs(glyph[2] - bg[2])) >= 6;
          if (wouldShow) { run.noInk = true; continue; }
        }
        run.everSampled = true;

        const ratio = contrast(glyph, bg);
        if (!run.measured || ratio < run.measured.ratio) {
          run.measured = { ratio, bg, glyph };
          n++;
        }
      }
      return n;
    };

    try {
      // 25% band overlap so a run straddling a boundary still lands wholly
      // inside some band.
      const docH = de.scrollHeight;
      const step = Math.max(120, Math.round(VHb * 0.75));
      for (let y = 0; y < docH; y += step) {
        w.scrollTo(0, y);
        await new Promise((r) => setTimeout(r, 90));
        await sampleBand();
      }
      // Anything still unmeasured is taller than the viewport, inside its own
      // scroller, or was hidden at every band position. Centre each one and try
      // once more; capped so a pathological page cannot stall the run.
      let leftovers = runs.filter((run) => !run.measured);
      for (const run of leftovers.slice(0, 60)) {
        try { run.el.scrollIntoView({ block: 'center' }); } catch (e) { continue; }
        await new Promise((r) => setTimeout(r, 60));
        await sampleBand();
      }
    } finally {
      de.classList.remove('__auditProbing');
      de.classList.remove('__auditFreeze');
      style.remove();
      w.scrollTo(0, 0);
      await new Promise((r) => setTimeout(r, 60));
    }

    /* Text that never survived clipping in any band is painted nowhere: a reel
       digit parked outside its 1em window, a carousel slide scrolled away. It
       has a rect, so the old method scored it, but scoring it means scoring a
       coordinate rather than a glyph. Dropped from the contrast pass and counted
       separately so the drop is visible rather than assumed. */
    R.textClipped = [];
    R.textOccluded = [];
    const kept = [];
    for (const run of runs) {
      if (!run.measured && !run.everVisible) {
        R.textClipped.push({ sel: path(run.el), text: run.txt.slice(0, 46) });
        continue;
      }
      /* Never once sampled: every point that should have shown ink showed the
         backdrop instead, so something is painting over the glyph. Worth knowing
         about in its own right -- text nobody can read is a worse defect than
         text at 3:1 -- but it is not a contrast measurement. */
      if (!run.measured && !run.everSampled && run.noInk) {
        R.textOccluded.push({
          sel: path(run.el), text: run.txt.slice(0, 46), fontSize: run.cs.fontSize,
          color: run.cs.color,
        });
        continue;
      }
      kept.push(run);
    }
    runs = kept;
    R.textRunTotal = runs.length;
    R.textMoved = runs.filter((r) => r.moved && !r.measured).length;
  }

  /* --- score, and compare the two methods ---------------------------------- */
  R.method = HAS_PIXELS ? 'measured' : 'estimated';
  const seen = new Map();
  const disagree = [];
  let measuredCount = 0;

  for (const run of runs) {
    // Legacy value, always computed, so the two methods can be compared even on
    // runs that pass. This is the whole audit trail for the repair.
    const anc = legacyAncestorBg(run.el, w);
    const rect = run.el.getBoundingClientRect();
    const under = legacyUnderlayBg(run.el, rect, opaques);
    const cands = [{ rgb: anc.rgb, from: 'ancestor' }];
    if (under) cands.push({ rgb: under.rgb, from: 'underlay ' + under.sel });
    let legacy = null;
    for (const cand of cands) {
      const a = run.paint.a;
      const g = a < 0.999 ? over(run.paint, cand.rgb) : [run.paint.r, run.paint.g, run.paint.b];
      const ratio = contrast(g, cand.rgb);
      if (!legacy || ratio > legacy.ratio) legacy = { ...cand, glyph: g, ratio };
    }

    const m = run.measured;
    if (m) measuredCount++;
    const ratio = m ? m.ratio : legacy.ratio;
    const bg = m ? m.bg : legacy.rgb;
    const glyph = m ? m.glyph : legacy.glyph;

    if (m) {
      const delta = Math.abs(m.ratio - legacy.ratio);
      const flips = (m.ratio >= run.needs) !== (legacy.ratio >= run.needs);
      if (flips || delta >= 0.5) {
        disagree.push({
          sel: path(run.el), text: run.txt.slice(0, 40),
          fontSize: run.cs.fontSize, needs: run.needs,
          measuredRatio: Math.round(m.ratio * 100) / 100, measuredBg: hex(m.bg),
          legacyRatio: Math.round(legacy.ratio * 100) / 100, legacyBg: hex(legacy.rgb),
          legacyBgFrom: legacy.from, legacyGuessedFromImage: anc.imageAt,
          delta: Math.round(delta * 100) / 100,
          verdictFlip: flips,
          // Which way the old method was wrong, in plain terms.
          legacyWas: legacy.ratio > m.ratio ? 'over-reported (looked better than it is)'
            : 'under-reported (looked worse than it is)',
        });
      }
    }

    if (ratio >= run.needs) continue;

    /* A run that only fails because an ancestor is fading it is a different
       animal from one that fails on its own colours: the first is a deliberate
       de-emphasis of content the reader is not looking at, the second is a
       defect at full strength. Split them so neither hides the other. */
    let bucket = 'chrome';
    if (run.artefact) bucket = 'artefact';
    if (run.eff < 0.999) {
      const atFull = contrast(
        run.paint.a < 0.999 ? over(run.paint, bg) : [run.paint.r, run.paint.g, run.paint.b], bg);
      if (atFull >= run.needs) bucket = 'dimmed';
    }
    if (run.paintFrom !== 'color') bucket = 'decorative';

    const key = hex(glyph) + '|' + hex(bg) + '|' + run.cs.fontSize + '|' + run.fw + '|' + bucket;
    const prev = seen.get(key);
    if (prev) {
      prev.count++;
      if (prev.samples.length < 3) prev.samples.push(path(run.el));
      continue;
    }
    const rec = {
      bucket,
      fg: hex(glyph), rawColor: run.cs.color, fgToken: tokenFor(run.cs.color),
      paintFrom: run.paintFrom,
      bg: hex(bg), bgToken: tokenFor('rgb(' + bg.map(Math.round).join(', ') + ')'),
      bgFrom: m ? 'measured pixel' : 'ESTIMATED ' + legacy.from,
      estimated: !m,
      fontSize: run.cs.fontSize, fontWeight: run.fw,
      ratio: Math.round(ratio * 100) / 100,
      needs: run.needs,
      opacity: Math.round(run.eff * 1000) / 1000,
      chainTinted: run.chainTinted,
      artefact: run.artefact,
      legacyRatio: Math.round(legacy.ratio * 100) / 100,
      legacyBg: hex(legacy.rgb),
      bgFromImage: anc.imageAt,
      count: 1, samples: [path(run.el)], text: run.txt.slice(0, 46),
    };
    seen.set(key, rec);
    R.contrast.push(rec);
  }

  R.contrast.sort((a, b) => a.ratio - b.ratio);
  R.contrastMeasured = measuredCount;
  R.contrastUnmeasured = runs.length - measuredCount;
  R.disagree = disagree.sort((a, b) => (b.verdictFlip - a.verdictFlip) || (b.delta - a.delta));

  /* ---- 7. head consistency ---- */
  const links = [...d.querySelectorAll('link')];
  const scripts = [...d.querySelectorAll('script[src]')];
  const sheets = links.filter((l) => (l.rel || '').toLowerCase().includes('stylesheet'))
    .map((l) => l.getAttribute('href'));
  const H = {
    stylesheets: sheets,
    icon: links.filter((l) => (l.rel || '').includes('icon')).map((l) => l.getAttribute('href')),
    manifest: links.filter((l) => (l.rel || '').includes('manifest')).map((l) => l.getAttribute('href')),
    scripts: scripts.map((s) => ({ src: s.getAttribute('src'), type: s.type || 'classic', defer: s.defer, async: s.async })),
    title: d.title,
    missing: [], extra: [],
  };
  for (const need of REQUIRED_HEAD.styles) {
    if (!sheets.some((h) => h && h.endsWith(need))) H.missing.push('stylesheet ' + need);
  }
  if (!REQUIRED_HEAD.pageStyles.some((p) => sheets.some((h) => h && h.endsWith(p)))) {
    H.missing.push('page stylesheet (home/case/concept).css');
  }
  for (const need of REQUIRED_HEAD.scripts) {
    if (!H.scripts.some((s) => s.src && s.src.endsWith(need.split('/').pop()))) H.missing.push(need);
  }
  if (!H.icon.some((h) => h && h.endsWith('favicon.svg'))) H.missing.push('favicon.svg');
  if (!H.manifest.some((h) => h && h.endsWith('manifest.webmanifest'))) H.missing.push('manifest.webmanifest');
  H.metaViewport = (d.querySelector('meta[name="viewport"]') || {}).content || null;
  H.metaDescription = !!d.querySelector('meta[name="description"]');
  H.lang = de.getAttribute('lang');
  R.head = H;

  /* ---- 8. every URL the document actually references ---- */
  const refs = new Set();
  const add = (u) => {
    if (!u) return;
    const s = String(u).trim();
    if (!s || s.startsWith('data:') || s.startsWith('#') || s.startsWith('%23')
      || s.startsWith('blob:') || s.startsWith('javascript:') || s.startsWith('mailto:')
      || s.startsWith('tel:')) return;
    try { refs.add(new URL(s, d.baseURI).href); } catch (e) { /* unparseable */ }
  };
  links.forEach((l) => add(l.getAttribute('href')));
  scripts.forEach((s) => add(s.getAttribute('src')));
  d.querySelectorAll('img[src]').forEach((n) => add(n.getAttribute('src')));
  d.querySelectorAll('[srcset]').forEach((n) => {
    (n.getAttribute('srcset') || '').split(',').forEach((p) => add(p.trim().split(/\s+/)[0]));
  });
  d.querySelectorAll('source[src],video[src],audio[src],video[poster],iframe[src],embed[src],object[data]')
    .forEach((n) => { add(n.getAttribute('src')); add(n.getAttribute('poster')); add(n.getAttribute('data')); });
  d.querySelectorAll('use').forEach((n) => add(n.getAttribute('href') || n.getAttributeNS('http://www.w3.org/1999/xlink', 'href')));
  // An inline SVG data URI contains its own url(%23id) filter references, and
  // those parens mean a [^)] scan stops short — match to the closing quote
  // instead, or the grain texture in base.css leaks in as a /work/%23n 404.
  const stripData = (s) => s
    .replace(/url\((["'])data:[\s\S]*?\1\)/g, 'url(data:)')
    .replace(/url\(data:[^)]*\)/g, 'url(data:)');
  const urlsIn = (s, base) => {
    const found = [];
    const re = /url\((['"]?)([^'")]+)\1\)/g;
    let m;
    while ((m = re.exec(stripData(s)))) found.push(m[2]);
    return found;
  };
  for (const el of all) {
    const cs = csOf(el);
    for (const prop of ['backgroundImage', 'maskImage', 'borderImageSource', 'listStyleImage']) {
      const v = cs[prop];
      if (!v || v === 'none') continue;
      urlsIn(v).forEach(add);
    }
  }
  // Same-origin sheets expose cssRules, which is where @font-face src lives.
  for (const ss of [...d.styleSheets]) {
    let rules = null;
    try { rules = ss.cssRules; } catch (e) { R.notes.push('stylesheet unreadable: ' + ss.href); continue; }
    const walk = (list) => {
      for (const rule of list) {
        if (rule.cssRules) { walk(rule.cssRules); continue; }
        for (const u of urlsIn(rule.cssText || '')) {
          if (u.startsWith('#') || u.startsWith('%23') || u.startsWith('data:')) continue;
          try { refs.add(new URL(u, ss.href || d.baseURI).href); } catch (e) { /* skip */ }
        }
      }
    };
    walk(rules);
  }
  R.resources = [...refs];
  return R;
}

/* ---------------- iframe driver ---------------- */

const statusCache = new Map();
async function statusOf(url) {
  if (statusCache.has(url)) return statusCache.get(url);
  let s;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    s = r.status;
  } catch (e) {
    s = 'network-error:' + e.message;
  }
  statusCache.set(url, s);
  return s;
}

function runOne(pageUrl, vp) {
  return new Promise((resolve) => {
    const frame = document.createElement('iframe');
    frame.width = vp.w;
    frame.height = vp.h;
    frame.style.width = vp.w + 'px';
    frame.style.height = vp.h + 'px';
    document.getElementById('stage').appendChild(frame);

    const runtime = { jsErrors: [], resourceErrors: [], consoleErrors: [], hookedAt: null };
    let done = false;

    // Errors must be captured before the page's own scripts run. Every script on
    // these pages is type=module or defer, so both execute after parsing; a tight
    // poll that installs hooks while readyState is still 'loading' gets in first.
    let hooked = false;
    const tryHook = () => {
      if (hooked) return;
      let w;
      try { w = frame.contentWindow; } catch (e) { return; }
      if (!w || !frame.contentDocument) return;
      const href = w.location.href;
      if (href === 'about:blank' || !href.includes(pageUrl.split('/').pop())) return;
      hooked = true;
      runtime.hookedAt = frame.contentDocument.readyState;
      w.addEventListener('error', (e) => {
        const t = e.target;
        if (t && t !== w && t.tagName) {
          runtime.resourceErrors.push(t.tagName.toLowerCase() + ' failed: ' +
            (t.getAttribute('src') || t.getAttribute('href') || '(inline)'));
        } else {
          runtime.jsErrors.push((e.message || 'error') + ' @ ' +
            (e.filename || '').split('/').pop() + ':' + e.lineno);
        }
      }, true);
      w.addEventListener('unhandledrejection', (e) => {
        runtime.jsErrors.push('unhandled rejection: ' + (e.reason && (e.reason.message || e.reason)));
      });
      const ce = w.console.error;
      w.console.error = function (...a) {
        runtime.consoleErrors.push(a.map(String).join(' ').slice(0, 200));
        ce.apply(w.console, a);
      };
    };

    const poll = setInterval(tryHook, 4);
    frame.src = SITE + pageUrl + '?qa=' + Date.now();

    const finish = async () => {
      if (done) return;
      done = true;
      clearInterval(poll);
      let R;
      try {
        const w = frame.contentWindow;
        const d = frame.contentDocument;

        // Settle the page deterministically: force every reveal state on and
        // dismiss the loader so measurements describe the resting layout, then
        // sweep the scroll position so lazy images and observers all commit.
        d.querySelectorAll('[data-reveal],.reveal-lines,.media-reveal').forEach((e) => e.classList.add('is-in'));
        const intro = d.getElementById('intro');
        if (intro) { intro.classList.add('is-done'); intro.style.display = 'none'; }
        d.querySelectorAll('img[loading="lazy"]').forEach((i) => i.setAttribute('loading', 'eager'));
        const H = d.documentElement.scrollHeight;
        for (let y = 0; y < H; y += Math.max(200, vp.h * 0.8)) w.scrollTo(0, y);
        w.scrollTo(0, 0);
        await new Promise((r) => setTimeout(r, 600));
        try { await d.fonts.ready; } catch (e) { /* no font api */ }
        await new Promise((r) => setTimeout(r, 500));

        // The stage is parked off-canvas between captures; its on-screen
        // position during one is the host document origin.
        R = await analyze(w, d, vp, pageUrl, { x: 0, y: 0 });
      } catch (e) {
        R = {
          page: pageUrl, vp: vp.tag, vw: vp.w, vh: vp.h,
          method: HAS_PIXELS ? 'measured' : 'estimated',
          fatal: e.message + '\n' + (e.stack || ''),
          overflow: [], clipped: [], overlap: [], images: [], tap: [],
          contrast: [], disagree: [], textUnpainted: [],
          head: {}, resources: [], notes: [],
        };
      }
      R.runtime = runtime;
      frame.remove();

      R.badResources = [];
      for (const u of R.resources || []) {
        const s = await statusOf(u);
        if (s !== 200) R.badResources.push({ url: u.replace(SITE, '/'), status: s });
      }
      resolve(R);
    };

    frame.addEventListener('load', () => setTimeout(finish, 1400));
    setTimeout(finish, 20000);
  });
}

/* ---------------- summary rendering ---------------- */

function summarise(R) {
  const L = [];
  const tag = `${R.page} @ ${R.vp} ${R.vw}x${R.vh}`;
  if (R.fatal) { L.push(`[FATAL] ${tag}\n    ${R.fatal}`); return L.join('\n'); }
  const byBucket = (b) => R.contrast.filter((c) => c.bucket === b);
  const counts = {
    ovf: R.overflow.length, clip: R.clipped.filter((c) => c.kind !== 'truncated-by-design').length,
    olap: R.overlap.length, img: R.images.filter((i) => i.issues.includes('failed-to-load')).length,
    cls: R.images.filter((i) => i.issues.includes('no-reserved-aspect-ratio')).length,
    // WCAG 2.5.8 exempts a target inside a sentence, so an inline prose link is
    // listed for review but does not fail the page. Standalone controls do.
    tap: R.vp === 'mobile' ? R.tap.filter((t) => !t.inProse).length : 0,
    // Only chrome counts toward the verdict. Artefact interiors, deliberately
    // dimmed runs and stroke-only decoration are all printed below, each under
    // its own heading, and each is a note rather than a broken page.
    con: byBucket('chrome').length,
    conArt: byBucket('artefact').length,
    conDim: byBucket('dimmed').length,
    conDec: byBucket('decorative').length,
    accent: (R.accentCheck || []).filter((a) => !a.passes45).length,
    js: R.runtime.jsErrors.length + R.runtime.consoleErrors.length,
    net: R.badResources.length,
  };
  const bad = counts.ovf || counts.clip || counts.olap || counts.img || counts.js || counts.net
    || counts.tap || counts.con || counts.accent || R.doc.overflowX > 1 || R.head.missing.length;
  L.push(`\n[${bad ? 'FAIL' : 'ok  '}] ${tag}`);
  L.push(`  doc scrollW=${R.doc.scrollWidth} clientW=${R.doc.clientWidth} overflowX=${R.doc.overflowX} scrollH=${R.doc.scrollHeight}  hooked@${R.runtime.hookedAt}`);
  L.push(`  inspected: ${R.elTotal} elements, ${R.textElTotal} text nodes, ${R.imgLoaded}/${R.imgTotal} images loaded, ${R.resources.length} urls`);
  const cov = R.textRunTotal
    ? `${R.contrastMeasured}/${R.textRunTotal} text runs measured from pixels` +
      (R.contrastUnmeasured ? `, ${R.contrastUnmeasured} ESTIMATED (never fully on screen)` : '') +
      (R.textClipped && R.textClipped.length ? `, ${R.textClipped.length} skipped (clipped out of view, painted nowhere)` : '') +
      (R.textOccluded && R.textOccluded.length ? `, ${R.textOccluded.length} skipped (paints no pixels)` : '') +
      (R.textMoved ? `, ${R.textMoved} discarded (moved during capture)` : '')
    : 'no text runs';
  L.push(`  contrast: ${R.method === 'measured' ? cov : 'ESTIMATED for all runs -- no pixel transport, see header'}`);

  if (R.head.missing.length) L.push('  HEAD missing: ' + R.head.missing.join(', '));
  if (R.badResources.length) {
    L.push('  BAD RESOURCES:');
    R.badResources.forEach((b) => L.push(`    ${b.status}  ${b.url}`));
  }
  R.runtime.jsErrors.forEach((e) => L.push('  JS ERROR: ' + e));
  R.runtime.consoleErrors.forEach((e) => L.push('  console.error: ' + e));
  R.runtime.resourceErrors.forEach((e) => L.push('  RESOURCE EVENT: ' + e));

  if (R.overflow.length) {
    L.push('  HORIZONTAL OVERFLOW:');
    R.overflow.forEach((o) => L.push(
      `    ${o.sel}\n      w=${o.width} left=${o.left} right=${o.right} pastRight=${o.pastRight} pastLeft=${o.pastLeft} pos=${o.pos}${o.text ? '  text="' + o.text + '"' : ''}`));
  }
  const realClip = R.clipped.filter((c) => c.kind !== 'truncated-by-design');
  if (realClip.length) {
    L.push('  TEXT CLIP/OVERFLOW:');
    realClip.forEach((c) => L.push(
      `    [${c.kind}] ${c.sel}\n      box=${c.clientW}x${c.clientH} content=${c.scrollW}x${c.scrollH} lostX=${c.lostX} lostY=${c.lostY} fs=${c.fontSize} overflow=${c.overflowX}/${c.overflowY} text="${c.text}"`));
  }
  if (R.overlap.length) {
    L.push('  TEXT OVERLAP:');
    R.overlap.forEach((o) => L.push(
      `    ${o.overlapPx}px² (${o.frac}% of smaller, ${o.ox}x${o.oy})\n      A ${o.a} [${o.aPos}] "${o.aText}"\n      B ${o.b} [${o.bPos}] "${o.bText}"`));
  }
  if (R.images.length) {
    L.push('  IMAGES:');
    R.images.forEach((i) => L.push(
      `    ${i.issues.join(',')}  ${i.sel}\n      src=${i.src} natural=${i.naturalWidth} render=${i.renderW}x${i.renderH} attrDims=${i.hasAttrDims} ar=${i.cssAspectRatio}/${i.parentAspectRatio} fit=${i.objectFit} loading=${i.loading}`));
  }
  if (R.vp === 'mobile' && R.tap.length) {
    L.push('  TAP TARGETS < 44x44:  (hit = probed with elementFromPoint; inline-in-prose is advisory)');
    R.tap.forEach((t) => L.push(
      `    hit ${t.hitW}x${t.hitH} box ${t.w}x${t.h}${t.covered ? ' COVERED' : ''}${t.unprobed ? ' (off-viewport, box only)' : ''}${t.inProse ? ' (inline-in-prose)' : ''}  ${t.sel}  "${t.label}"${t.href ? ' -> ' + t.href : ''}`));
  }
  const line = (c) => {
    const bits = [
      `    ${c.ratio}:1 (needs ${c.needs})  fg=${c.fg}${c.fgToken ? ' [' + c.fgToken + ']' : ''}`,
      `on bg=${c.bg}${c.bgToken ? ' [' + c.bgToken + ']' : ''}`,
      `${c.fontSize}/${c.fontWeight}  x${c.count}`,
    ];
    let s = bits.join('  ');
    if (c.estimated) s += '  [ESTIMATED: ' + c.bgFrom + ']';
    if (c.opacity < 0.999) s += `  ancestor-opacity=${c.opacity}`;
    if (c.chainTinted) s += ' (faded ancestor paints its own bg -- composite approximate)';
    if (c.paintFrom !== 'color') s += `  glyph drawn by ${c.paintFrom}`;
    s += `\n      e.g. ${c.samples[0]}  "${c.text}"`;
    // What the old method would have said, whenever it would have said something
    // materially different. Keeps the repair auditable from the report itself.
    if (!c.estimated && Math.abs(c.legacyRatio - c.ratio) >= 0.5) {
      s += `\n      legacy ancestor-walk said ${c.legacyRatio}:1 on ${c.legacyBg}` +
        (c.bgFromImage ? ' — guessing, bg-image at ' + c.bgFromImage : '');
    }
    return s;
  };

  const chrome = byBucket('chrome');
  if (chrome.length) {
    L.push('  CONTRAST BELOW WCAG AA -- PAGE CHROME:');
    chrome.forEach((c) => L.push(line(c)));
  }
  const art = byBucket('artefact');
  if (art.length) {
    L.push('  CONTRAST BELOW AA INSIDE ARTWORK (content colour, not chrome -- review, does not fail the page):');
    art.forEach((c) => L.push(line(c) + `\n      inside ${c.artefact}`));
  }
  const dim = byBucket('dimmed');
  if (dim.length) {
    L.push('  CONTRAST BELOW AA ONLY WHILE FADED (passes at full opacity -- deliberate de-emphasis):');
    dim.forEach((c) => L.push(line(c)));
  }
  const dec = byBucket('decorative');
  if (dec.length) {
    L.push('  CONTRAST BELOW AA ON STROKE-ONLY DECORATION (no fill colour -- decorative by construction):');
    dec.forEach((c) => L.push(line(c)));
  }
  if (R.textOccluded && R.textOccluded.length) {
    L.push('  TEXT THAT PAINTS NO PIXELS (something opaque is over it; not scored for contrast):');
    R.textOccluded.slice(0, 8).forEach((t) => L.push(
      `    ${t.sel}  ${t.fontSize}  color=${t.color}  "${t.text}"`));
  }
  if (R.textUnpainted && R.textUnpainted.length) {
    L.push('  TEXT WITH NO PAINTED COLOUR (transparent fill, no stroke -- not scored):');
    R.textUnpainted.slice(0, 6).forEach((t) => L.push(`    ${t.sel}  color=${t.color}  "${t.text}"`));
  }

  if (R.accentCheck && R.accentCheck.length) {
    const failing = R.accentCheck.filter((a) => !a.passes45);
    if (failing.length) {
      L.push('  ACCENT TEXT TIER BELOW 4.5:1 vs ITS OWN GROUND:');
      failing.forEach((a) => L.push(
        `    ${a.ratio}:1  ${a.tierChecked}=${a.glyph} on --ink-0=${a.ground}  scope ${a.scope}${a.dataAccent ? ' [data-accent=' + a.dataAccent + ']' : ''}`));
    }
    // The material tier is printed as a fact, never as a failure: it is supposed
    // to be a mid-tone glaze and on a light ground nothing sets type in it.
    const info = R.accentCheck.map((a) => `${a.scope}${a.dataAccent ? '[' + a.dataAccent + ']' : ''} ` +
      `text ${a.tierChecked}=${a.glyph} ${a.ratio}:1` +
      (a.materialAsText !== null ? `, material --accent=${a.materialTier} would be ${a.materialAsText}:1` : ''));
    L.push('  accent tiers: ' + info.join(' | '));
  }

  if (R.disagree && R.disagree.length) {
    const flips = R.disagree.filter((x) => x.verdictFlip);
    L.push(`  BACKDROP METHOD DISAGREEMENT: ${R.disagree.length} run(s) differ by >=0.5, ${flips.length} of them flip pass/fail`);
    R.disagree.slice(0, 10).forEach((x) => L.push(
      `    measured ${x.measuredRatio}:1 on ${x.measuredBg}   vs   legacy ${x.legacyRatio}:1 on ${x.legacyBg} (${x.legacyBgFrom})` +
      `   delta ${x.delta}${x.verdictFlip ? '  *** VERDICT FLIP (needs ' + x.needs + ') ***' : ''}` +
      `\n      legacy ${x.legacyWas}` +
      (x.legacyGuessedFromImage ? `\n      legacy was guessing: ${x.legacyGuessedFromImage}` : '') +
      `\n      ${x.sel}  "${x.text}"`));
    if (R.disagree.length > 10) L.push(`    ... ${R.disagree.length - 10} more in the json`);
  }
  R.notes.forEach((n) => L.push('  note: ' + n));
  return L.join('\n');
}

/* ---------------- main ---------------- */

(async () => {
  const all = [];
  if (HAS_PIXELS) {
    log('contrast mode: MEASURED -- backdrops read from captured pixels');
  } else {
    log('contrast mode: ESTIMATED -- no pixel transport on this page.');
    log('  Every contrast figure below is an ancestor-background guess and is');
    log('  wrong wherever a gradient, photograph or <canvas> sits behind text,');
    log('  which on this site is every device mockup, poster and the hero.');
    log('  Run tools\\audit-drive.ps1 for measured numbers. See file header.');
  }
  for (const vp of vpList) {
    log(`\n=================== ${vp.tag} ${vp.w}x${vp.h} ===================`);
    for (const p of pageList) {
      const R = await runOne(p, vp);
      all.push(R);
      log(summarise(R));
    }
  }

  const slug = (only ? only.replace(/[^a-z0-9]+/gi, '-') : 'all') + (onlyVp ? '-' + onlyVp : '');
  await fetch('/_save?name=' + OUT_DIR + 'audit-' + slug + '.json',
    { method: 'POST', body: new Blob([JSON.stringify(all, null, 1)]) });
  await fetch('/_save?name=' + OUT_DIR + 'audit-' + slug + '.txt',
    { method: 'POST', body: new Blob([lines.join('\n')]) });
  log('\n--- done ---');
  document.title = 'audit-done';
  await fetch('/_save?name=' + OUT_DIR + 'AUDIT_DONE.txt',
    { method: 'POST', body: new Blob([slug + ' ' + new Date().toISOString()]) });
  // Lets the driver exit on a signal instead of polling for the title.
  if (typeof window.__auditDone === 'function') {
    window.__auditDone(JSON.stringify({ slug, mode: HAS_PIXELS ? 'measured' : 'estimated', runs: all.length }));
  }
})();
</script>
